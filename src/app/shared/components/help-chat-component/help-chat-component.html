<!-- ===========================================
     BOTÓN FLOTANTE
=========================================== -->

<button class="chat-toggle" (click)="toggleChat()" *ngIf="!opened">
  <i class="bi bi-chat-dots-fill"></i>
</button>

<!-- ===========================================
     CHAT
=========================================== -->

<div class="chat-window" *ngIf="opened" [class.minimized]="minimized">
  <!-- ===========================
       HEADER
  ============================ -->

  <div class="chat-header">
    <div class="chat-title">
      <i class="bi bi-brush-fill"></i>

      <div>
        <h3>Arte Ana M.</h3>

        <span>Asistente virtual</span>
      </div>
    </div>

    <div class="chat-actions">
      <button title="Nueva conversación" (click)="clearConversation()">
        <i class="bi bi-arrow-clockwise"></i>
      </button>

      <button title="Minimizar" (click)="minimize()">
        <i class="bi" [ngClass]="minimized ? 'bi-chevron-up' : 'bi-dash-lg'"> </i>
      </button>

      <button title="Cerrar" (click)="toggleChat()">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
  </div>

  <!-- ===========================
       CONTENIDO
  ============================ -->

  <ng-container *ngIf="!minimized">
    <div class="chat-body" #messagesContainer>
      <!-- MENSAJES -->

      <div *ngFor="let msg of messages" class="message" [ngClass]="msg.sender">
        <div class="bubble">
          <div class="text">
            {{ msg.text }}
          </div>

          <div class="time">
            {{ msg.time }}
          </div>

          <div class="bot-actions" *ngIf="msg.actions?.length">
            <button *ngFor="let action of msg.actions" (click)="executeAction(action)">
              <i [class]="action.icon"></i>

              {{ action.label }}
            </button>
          </div>
        </div>
      </div>

      <!-- ESCRIBIENDO -->

      <div class="message bot" *ngIf="writing">
        <div class="bubble typing">
          <span></span>

          <span></span>

          <span></span>
        </div>
      </div>
    </div>

    <!-- ===========================
         PREGUNTAS RÁPIDAS
    ============================ -->

    <div class="quick-questions">
      <button *ngFor="let question of quickQuestions" (click)="selectQuestion(question)">
        {{ question.question }}
      </button>
    </div>

    <!-- ===========================
         INPUT
    ============================ -->

    <div class="chat-input">
      <textarea
        rows="1"
        [(ngModel)]="message"
        (keydown)="onKeyDown($event)"
        placeholder="Escribe tu consulta..."
      >
      </textarea>

      <button class="send" (click)="sendMessage()" [disabled]="writing">
        <i class="bi bi-send-fill"></i>
      </button>
    </div>

    <!-- ===========================
         FOOTER
    ============================ -->

    <div class="chat-footer">
      <button class="contact" (click)="contact()">
        <i class="bi bi-envelope-fill"></i>

        Contactar con Ana
      </button>
    </div>
  </ng-container>
</div>
