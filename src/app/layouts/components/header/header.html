<header class="header">
  <div class="header-container">
    <a routerLink="/" class="logo" (click)="closeMenu()">
      <i class="bi bi-brush"></i>
      <h1>Arte Ana M.</h1>
    </a>

    <nav class="navbar" [class.mobile-active]="mobileMenuOpen">
      <ul>
        <li>
          <a routerLink="/" (click)="closeMenu()">Home</a>
        </li>

        <li>
          <a routerLink="/about" (click)="closeMenu()">About</a>
        </li>

        <li class="dropdown" [class.open]="galleryOpen">
          <a class="dropdown-title" (click)="toggleGallery()">
            Gallery

            <i class="bi bi-chevron-down" [class.rotate]="galleryOpen"> </i>
          </a>

          <ul [class.show]="galleryOpen">
            <li>
              <a routerLink="/gallery/mundo-animal" (click)="closeMenu()"> Mundo Animal </a>
            </li>

            <li>
              <a routerLink="/gallery/botanica" (click)="closeMenu()"> Arte Botánico </a>
            </li>

            <li>
              <a routerLink="/gallery/paisajes-naturales" (click)="closeMenu()">
                Paisajes Naturales
              </a>
            </li>

            <li>
              <a routerLink="/gallery/escenas-playa" (click)="closeMenu()"> Escenas de Playa </a>
            </li>

            <li>
              <a routerLink="/gallery/veleros" (click)="closeMenu()"> Veleros </a>
            </li>
          </ul>
        </li>

        <li>
          <a routerLink="/services" (click)="closeMenu()">Servicios</a>
        </li>

        <li>
          <a routerLink="/contact" (click)="closeMenu()">Contacto</a>
        </li>
      </ul>
    </nav>

    <div class="header-social-links desktop-social">
      <a
        href="https://es.wallapop.com/app/user/anam-76231494-08z82pdrw8z3/published"
        target="_blank"
      >
        <i class="bi bi-cart"></i>
      </a>

      <a href="https://www.instagram.com/a.m.art.inez/" target="_blank">
        <i class="bi bi-instagram"></i>
      </a>

      <div class="user-menu">
        @if (!isLogged()) {
          <button type="button" class="user-btn" (click)="login()">
            <i class="bi bi-person-circle"></i>
          </button>
        } @else {
          <button type="button" class="user-btn" (click)="toggleUserMenu()">
            <i class="bi bi-person-circle"></i>
          </button>

          @if (userMenuOpen) {
            <div class="user-dropdown">

              <button type="button" routerLink="/admin" (click)="closeUserMenu()">
                  <i class="bi bi-speedometer2"></i>
                  Panel de admin

              </button>
              <button type="button" (click)="logout()">
                <i class="bi bi-box-arrow-right"></i>

                Cerrar sesión
              </button>
            </div>
          }
        }
      </div>
    </div>

    <i
      class="bi mobile-nav-toggle"
      [class.bi-list]="!mobileMenuOpen"
      [class.bi-x]="mobileMenuOpen"
      (click)="toggleMenu()"
    >
    </i>
  </div>

  <div class="header-overlay active" *ngIf="mobileMenuOpen" (click)="closeMenu()"></div>
</header>
