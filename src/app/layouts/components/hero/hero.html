<br><br><br><br><br><section class="hero">

    <div class="container">

        <div class="hero-content">

            <div class="hero-text">

                <span class="hero-tag">
                    {{ tag }}
                </span>

                <h1>

                    {{ title }}

                </h1>

                <h2>

                    {{ subtitle }}

                </h2>

                <p>

                    {{ description }}

                </p>

                <div class="hero-actions">

                    <a
                        *ngIf="primaryButton"
                        [routerLink]="primaryLink"
                        class="btn btn-primary">

                        {{ primaryButton }}

                    </a>

                    <a
                        *ngIf="secondaryButton"
                        [routerLink]="secondaryLink"
                        class="btn btn-outline">

                        {{ secondaryButton }}

                    </a>

                </div>

            </div>

            <div class="hero-image">

                <img
                    [src]="image"
                    [alt]="title">

            </div>

        </div>

    </div>

</section>
