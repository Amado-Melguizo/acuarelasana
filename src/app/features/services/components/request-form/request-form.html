<section id="request-form" class="request-form service-request">
  <div class="container">
    <div class="section-header text-center">
      <h2>Solicitar un encargo</h2>

      <p>
        Completa este formulario y nos pondremos en contacto contigo para preparar tu obra
        personalizada.
      </p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label>Nombre *</label>

          <input type="text" class="form-control" formControlName="name" />
        </div>

        <div class="col-md-6 mb-3">
          <label>Correo electrónico *</label>

          <input type="email" class="form-control" formControlName="email" />
        </div>

        <div class="col-md-6 mb-3">
          <label>Teléfono</label>

          <input type="text" class="form-control" formControlName="phone" />
        </div>

        <!-- Obra existente -->

        <div class="col-md-6 mb-3">
          <label>Obra de la galería (opcional)</label>

          <select class="form-select" formControlName="paintingSelection">
            <option value="">Selecciona una obra...</option>

            @for (painting of artworks(); track painting.id) {
              <option [value]="painting.id">
                {{ painting.title }}
              </option>
            }
          </select>
        </div>

        <div class="col-md-6 mb-3">
          <label>Tipo de solicitud *</label>

          <select class="form-select" formControlName="service">
            <option value="">Seleccionar...</option>

            <option>Retrato</option>

            <option>Retrato de mascota</option>

            <option>Acuarela personalizada</option>

            <option>Paisaje</option>

            <option>Arte botánico</option>

            <option>Dibujo a carboncillo</option>

            <option>Información sobre una obra</option>
          </select>
        </div>

        <!-- Nombre libre de la obra -->

        <div class="col-md-6 mb-3">
          <label>Nombre de la obra (opcional)</label>

          <input
            type="text"
            class="form-control"
            formControlName="paintingTitle"
            placeholder="Ej. Recuerdo familiar"
          />
        </div>

        <div class="col-12 mb-3">
          <label>Descripción *</label>

          <textarea rows="6" class="form-control" formControlName="description"></textarea>
        </div>

        <div class="col-md-4 mb-3">
          <label>Estilo</label>

          <input class="form-control" formControlName="style" />
        </div>

        <div class="col-md-4 mb-3">
          <label>Tamaño</label>

          <input class="form-control" formControlName="size" />
        </div>

        <div class="col-md-4 mb-3">
          <label>Presupuesto (€)</label>

          <input type="number" class="form-control" formControlName="budget" />
        </div>

        <div class="col-md-6 mb-4">
          <label>Fecha deseada</label>

          <input type="date" class="form-control" formControlName="deliveryDate" />
        </div>
      </div>

      <button class="btn btn-primary" type="submit">Enviar solicitud</button>
    </form>
  </div>
</section>
